<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testes com Imputs</title>
</head>
<style>
    *{
        margin-bottom: 15px;
    }
</style>

<body>
    <img src="https://placehold.co/600x400?text=Hello\nWorld" alt="Imagem da API Placehold">
    <hr>
    <h1>Entrar</h1>

        <form action="/enviar.html">

            <label for="CPF">CPF:</label>
            <input type="number" id="cpf" placeholder="Digite seu CPF"/>
            
            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Digite sua senha"/>
            
            <hr>
            <p>Botões com a TAG Button</p>
            <button type="submit">Enviar Submit</button>
            <button type="reset">Limpar</button>
            <hr>

            <p>Botões com a TAG Input</p>
            <input type="button" value="Enviar" />
            <input type="submit" value="Enviar Submit" />
            <input type="reset" value="Limpar" />
        </form>
    <br>
    
</body>
</html>
