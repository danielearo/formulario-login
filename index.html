<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testes com Imputs</title>
</head>
<style>
    *{
        margin-bottom: 15px;
    }
</style>

<body>
    <img src="https://placehold.co/600x400?text=Hello\nWorld" alt="Imagem da API Placehold">
    <hr>
    <h1>Entrar</h1>

        <form action="/enviar.html">

            <label for="CPF">CPF:</label><br>
            <input type="text" id="cpf" placeholder="Digite seu CPF" maxlength="11"/>
            <br>

            <label for="senha">Senha:</label>
            <br>
            <input type="password" id="senha" placeholder="Digite sua senha" max="5" required/>

            
            
            <hr>
            <p>Botões com a TAG Button</p>
            <button type="submit">Enviar Submit</button>
            <button type="reset">Limpar</button>
            <hr>

            <p>Botões com a TAG Input</p>
            <input type="button" value="Enviar" />
            <input type="submit" value="Enviar Submit" />
            <input type="reset" value="Limpar" />

            <p>Selecione sua linguagem favorita</p>
            <input type="radio" id="html" name="opt_html" value="html"/>
            <label for="html">HTML</label>

            <input type="radio" id="css" name="opt_css" value="css"/>
            <label for="css">CSS</label>

            <input type="radio" id="python" name="opt_python" value="python"/>
            <label for="python">PYTHON</label>

            <p>Selecione o dia que você tem disponibilidade:</p>

            <input type="checkbox"  id="segunda" value="Segunda-feira" checked/>
            <label for="segunda">Segunda-feira</label>

            <input type="checkbox"  id="terca" value="Terça-feira"/>
            <label for="terca">Terça-feira</label>

            <input type="checkbox"  id="sexta" value="Sexta-feira"/>
            <label for="sexta">Sexta-feira</label>

            <hr>
            <p>Qual a sua cor favorita?</p>
            <input type="color" value="#fff">

        </form>
    <br>
    
</body>
</html>
